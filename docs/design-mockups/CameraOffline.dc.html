      <span style="font-size: 15px; line-height: 20px; font-weight: 600">Riya &amp; Arjun</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; color: #A1A1AA">Sangeet

    </div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Switch camera" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M176 104h48V56"></path><path d="M224 104a96 96 0 0 0-176-24"></path><path d="M80 152H32v48"></path><path d="M32 152a96 96 0 0 0 176 24"></path></svg>

        <span style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D4D4D8">2</span>
      </div>
      <span style="width: 40px"></span>
    </div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 18px">
    <div style="width: 72px; display: flex; flex-direction: column">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 28px; line-height: 32px; font-weight: 600">21</span>
      <span style="font-size: 13px; line-height: 18px; color: #A1A1AA">shots left</span>
    </div>
    <button type="button" aria-label="Take a photo" style="width: 84px; height: 84px; border-radius: 50%; border: 4px solid #FFFFFF; background: transparent; padding: 5px; cursor: pointer">
      <span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span>
    </button>
    <div style="width: 72px; display: flex; justify-content: flex-end">
      <div style="position: relative; width: 48px; height: 56px">
        <span style="position: absolute; right: 0; top: 0; width: 40px; height: 48px; border-radius: 9px; background: #3A3A40"></span>
        <span style="position: absolute; left: 0; bottom: 0; width: 42px; height: 50px; border-radius: 9px; background: #1C1C1F; border: 1.5px solid #52525B; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">6</span>

    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="#D4D4D8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="128" r="96"></circle><path d="M128 72v56l36 24"></path></svg>
    3 photos on this phone · they send when signal returns
  </div>
</div>
