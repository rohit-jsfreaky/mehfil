<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mehfil · Host sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2F3BD8}a:hover{color:#1F28A8}
input::placeholder{color:#9A9AA4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; color: #0E0E12; padding: 16px 20px 24px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; height: 40px">
    <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.3px">mehfil</span>
  </div>

  <h1 style="margin: 40px 0 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.5px">The wedding's camera, on every guest's phone</h1>
  <p style="margin: 10px 0 0; font-size: 17px; line-height: 24px; color: #5F5F6B">Guests scan one QR and shoot, even with no signal. The album opens for everyone the next morning.</p>

  <span style="margin-top: 32px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #9A9AA4">Hosting an event</span>
  <label for="hostEmail" style="position: absolute; left: -9999px">Email</label>
  <input id="hostEmail" type="email" placeholder="Email" style="margin-top: 10px; height: 52px; border-radius: 14px; border: 0; background: #F4F4F6; color: #0E0E12; padding: 0 16px; font-family: 'Hanken Grotesk', sans-serif; font-size: 17px; outline: none">
  <label for="hostPassword" style="position: absolute; left: -9999px">Password</label>
  <input id="hostPassword" type="password" placeholder="Password" style="margin-top: 8px; height: 52px; border-radius: 14px; border: 0; background: #F4F4F6; color: #0E0E12; padding: 0 16px; font-family: 'Hanken Grotesk', sans-serif; font-size: 17px; outline: none">
  <button type="button" style="margin-top: 12px; height: 54px; border-radius: 99px; border: 0; background: #0E0E12; color: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer">Sign in</button>
  <div style="margin-top: 14px; display: flex; justify-content: space-between; font-size: 15px; line-height: 20px">
    <a href="#create" style="font-weight: 600; text-decoration: none">Create a host account</a>
    <a href="#forgot" style="color: #5F5F6B; text-decoration: none">Forgot password</a>
  </div>

  <div style="flex: 1"></div>

  <div style="padding: 16px; border-radius: 16px; background: #F4F4F6; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 17px; line-height: 22px; font-weight: 600">Have a guest code?</span>
      <span style="font-size: 13px; line-height: 18px; color: #5F5F6B">It's on the card at your table, under the QR</span>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="guestCode" style="position: absolute; left: -9999px">Guest code</label>
      <input id="guestCode" type="text" placeholder="D8JK8J" style="flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid #E6E6EA; background: #FFFFFF; color: #0E0E12; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 1px; outline: none">
      <button type="button" style="height: 48px; padding: 0 20px; border-radius: 99px; border: 0; background: #0E0E12; color: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Join</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
