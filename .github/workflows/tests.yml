name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.1.0-beta.3'
      SERVERPOD_PASSWORD_database: 'Q-Fk5SVFZz8zL5X_I-jWXiS0IkLoKsYK'
      SERVERPOD_PASSWORD_redis: 'sM68enq5TlKkMyKi3wMZPX2ot45_9B4n'
      # Test-only peppers for the auth services the tests start (guest
      # recovery issues real tokens). Not used by any deployed server.
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'IWwBHWABMdiiwYNrAyTpjRqceIRM8wc-'
      SERVERPOD_PASSWORD_emailSecretHashPepper: '9yHhgMKTXlf3efYdKOEyzpk50CSaVQnx'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        working-directory: mehfil
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: mehfil/mehfil_server
        run: serverpod generate

      - name: Run tests
        working-directory: mehfil/mehfil_server
        run: dart test
