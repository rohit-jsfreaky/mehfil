### A person who joined an event from the QR (anonymous sign-in + a name).
class: Guest
table: guest
fields:
  eventId: int, relation(parent=event, onDelete=Cascade)
  authUserId: UuidValue
  name: String
  joinedAt: DateTime, default=now
  ### SHA-256 of the guest's recovery key. The phone keeps the key; if its
  ### session is ever lost (a refresh cut short), the key gets the same guest
  ### back, with its queued photos. Never sent to any client.
  recoveryHash: String?, scope=serverOnly
indexes:
  guest_event_user_idx:
    fields: eventId, authUserId
    unique: true
