<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mehfil: the wedding's disposable camera on every guest's phone. Works with no signal.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mehfil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mehfil</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#FFFFFF">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline shell (see mehfil_sw.js). Registered after load so it never
    // slows the first open.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/mehfil_sw.js').catch(() => {});
        // Once the app is up, hand the worker the list of files it used.
        const keep = () => navigator.serviceWorker.ready.then((reg) => {
          const urls = performance.getEntriesByType('resource')
            .map((e) => e.name.split('#')[0])
            .filter((u) => u.startsWith(location.origin));
          // The database worker loads these itself, outside this page's list.
          for (const f of ['/index.html', '/sqlite3.wasm', '/db_worker.js']) urls.push(location.origin + f);
          reg.active && reg.active.postMessage({ mehfilCache: urls });
        });
        setTimeout(keep, 4000);
        setTimeout(keep, 15000);
      });
    }
  </script>
</body>
</html>
