# Kept small on purpose: the build laptop has 12 GB of RAM and crashes under full load.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: and the pub cache on C:; Kotlin's incremental caches fail
# across drives on Windows ("Could not close incremental caches").
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
